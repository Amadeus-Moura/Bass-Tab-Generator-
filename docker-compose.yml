services:
  postgres:
    image: postgres:16-alpine
    container_name: bass_tab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     bass_tab
      POSTGRES_PASSWORD: bass_tab_secret
      POSTGRES_DB:       bass_tab
    ports:
      - "5432:5432"
    volumes:
      - bass_tab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bass_tab -d bass_tab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Drizzle Studio roda localmente (npx drizzle-kit studio).
  # pgAdmin opcional: descomente se quiser interface gráfica do banco.
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: bass_tab_pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL:    admin@local.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  bass_tab_pgdata:
    name: bass_tab_pgdata
