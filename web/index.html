<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bass Tab — Gerador de Tablatura</title>
    <meta name="description" content="Visualizador interativo de tablatura para baixo elétrico gerada por ML a partir de áudio." />
    <meta name="theme-color" content="#0d0d14" />

    <!-- Preconnect para Google Fonts (reduz latência DNS+TCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fontes carregadas de forma NÃO-BLOQUEANTE (media="print" + onload trick).
      A página renderiza imediatamente com as fontes de sistema (Inter/Segoe UI),
      e quando as fontes Web chegarem, a UI atualiza sem re-layout visível.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700;800&display=swap"
      />
    </noscript>

    <!-- Favicon emoji -->
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
